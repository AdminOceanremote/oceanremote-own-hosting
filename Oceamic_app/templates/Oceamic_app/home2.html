{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h3 class="fw-bold mb-4">System Status</h3>

    <div class="row g-3">
        {% for device in devices %}
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm border-0" style="border-radius: 12px;">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between">
                        <h6 class="text-muted small mb-1">{{ device.name }}</h6>
                        <span class="badge bg-light text-dark">{{ device.device_id }}</span>
                    </div>
                    <div class="d-flex align-items-baseline gap-2">
                        <span class="display-6 fw-bold text-primary">{{ device.current_temp }}°C</span>
                        <span class="text-muted small">/ {{ device.nominal_temperature }}°C</span>
                    </div>
                    <div class="mt-2 pt-2 border-top d-flex justify-content-between align-items-center">
                        <span class="small text-muted">Humidity: <b>{{ device.current_hum }}%</b></span>
                        <a href="{% url 'device_analysis' device.device_id %}" class="btn btn-sm btn-outline-secondary">Analysis</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    // Refresh page every 60s
    setTimeout(() => { location.reload(); }, 60000);
</script>
{% endblock %}
