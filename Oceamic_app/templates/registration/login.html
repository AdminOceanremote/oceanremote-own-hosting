<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oceamic | Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #1a6f8b;
            --brand-dark: #0d4b63;
            --bg-gradient: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #1e293b;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease;
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-weight: 600;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--brand-dark);
        }

        p.subtitle {
            text-align: center;
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 2rem;
        }

        /* Form Styling */
        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            color: #475569;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(26, 111, 139, 0.1);
            background: white;
        }

        /* Checkbox Styling */
        .terms-wrap {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 12px;
            margin: 1.5rem 0;
        }

        .form-check-label {
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-login {
            background: var(--brand-primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            width: 100%;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(26, 111, 139, 0.3);
        }

        .btn-login:hover, .btn-login:active {
            background: var(--brand-dark);
            transform: translateY(-1px);
        }

        /* Full Screen Loader */
        #loader {
            display: none;
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--brand-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            body { padding: 1rem; align-items: flex-start; padding-top: 10%; }
            .login-card { padding: 1.5rem; border-radius: 16px; }
        }
    </style>
</head>
<body>
    {% load static %}

    <div id="loader">
        <div class="spinner"></div>
        <p class="mt-3 text-muted">Securing Connection...</p>
    </div>

    <div class="login-card" id="loginCard">
        <div class="brand-logo">
            <img src="{% static 'images/pic2.png' %}" alt="Logo" style="width: 50px;">
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to monitor your devices</p>

        <form method="post" action="{% url 'login' %}" onsubmit="return handleLogin()">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="terms-wrap">
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="readTerms" required>
                    <label class="form-check-label" for="readTerms">
                        I read the <a href="#" class="text-decoration-none" onclick="showTerms()">Terms of Use</a>
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="acceptTerms" required>
                    <label class="form-check-label" for="acceptTerms">
                        I accept all conditions
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>

    <script>
        function handleLogin() {
            document.getElementById('loginCard').style.opacity = '0';
            document.getElementById('loader').style.display = 'flex';
            return true; // Form continues to Django
        }

        function showTerms() {
            alert("Terms of Use:\n1. Ownership: Property of Oceamic II.\n2. Usage: Authorized internal monitoring only.");
        }
    </script>
    <footer style="position:fixed;bottom:0;left:0;right:0;text-align:center;padding:12px 16px;font-size:0.78rem;color:#64748b;background:rgba(255,255,255,0.6);backdrop-filter:blur(6px);border-top:1px solid rgba(0,0,0,0.05);">
        &copy; <span id="year"></span> <strong>OceanRemote</strong> &mdash; All rights reserved to
        <a href="https://oceanremote.net" target="_blank" rel="noopener" style="color:#1a6f8b;text-decoration:none;">oceanremote.net</a><br>
        Support: <a href="mailto:support@oceanremote.net" style="color:#1a6f8b;text-decoration:none;">support@oceanremote.net</a>
        &nbsp;|&nbsp;
        Admin: <a href="mailto:admin@oceanremote.net" style="color:#1a6f8b;text-decoration:none;">admin@oceanremote.net</a>
    </footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
